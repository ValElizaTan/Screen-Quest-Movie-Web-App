<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <a href="/">Home</a>
        <div class="authenticatedSection">
            <a href="/addMovies.html">Add Movie</a>
            <a href="/searchTicket.html">Search Tickets</a>
            <a href="/addPlaylist.html">Add Playlist</a>
            <a href="/getPlaylist.html">Get Playlist</a>
            <a href="/profile.html">Profile</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
        <div class="unauthenticatedSection">
            <a href="/login">Login</a>
        </div>
    </header>
    <div class="authenticatedSection">
        <form id="editProfileForm">
            <h1>Edit Profile</h1>
            <label for="username">Username:</label>
            <input type="text" name="username" id="username"><br><br>
            <label for="name">Name: </label>
            <input type="text" name="name" id="name"><br><br>
            <label for="password">Password:</label>
            <input type="text" name="password" id="password"><br><br>
            <input type="submit" value="Save Profile">
            <br>
            <button id="deleteProfileBtn">Delete Profile</button>
            <div id="statusMessage"></div>
        </form>
    </div>
    <div class="unauthenticatedSection">
        <p>
            You are not allowed to add new movie. Please <a href="/login.html">login</a> first.
        </p>
    </div>

    <script src="/js/jquery.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/editProfile.js"></script>
</body>

</html>
