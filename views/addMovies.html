<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <a href="/">Home</a>
        <div class="authenticatedSection">
            <a href="/searchTicket.html">Search Tickets</a>
            <a href="/addPlaylist.html">Add Playlist</a>
            <a href="/getPlaylist.html">Get Playlist</a>
            <a href="/profile.html">Profile</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
        <div class="unauthenticatedSection">
            <a href="/login.html">Login</a>
            <a href="/register.html">Register</a>
        </div>
    </header>
    <div class="authenticatedSection">
        <form id="addMovieForm">
            <h1>Add Movie</h1>
            <label for="title">Title:</label>
            <input type="text" name="title" id="title"><br><br>
            <label for="overview">Description: </label>
            <input type="text" name="overview" id="overview"><br><br>
            <label for="release_date">Release Date:</label>
            <input type="date" name="release_date" id="release_date"><br><br>
            <label for="vote_average">Rating: </label>
            <input type="number" name="vote_average" id="vote_average"><br>
            <br>
            <input type="submit" value="Add movie">

            <div id="statusMessage"></div>
        </form>
    </div>
    <div class="unauthenticatedSection">
        <p>
            You are not allowed to add new movie. Please <a href="/login.html">login</a> first.
        </p>
    </div>

    <script src="/js/jquery.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/addMovie.js"></script>
</body>

</html>
